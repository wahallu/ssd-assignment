version: '3.8'

# ------------------------------------------------------------------
# All secrets (database URIs, JWT secret, internal service key, OAuth
# credentials) are injected from the environment / a local .env file
# that is NEVER committed. See .env.example for the required keys.
# ------------------------------------------------------------------

services:

  event-service:
    build:
      context: ./eventservice
      dockerfile: Dockerfile
    container_name: event-service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGODB_URI=${EVENT_MONGODB_URI}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    networks:
      - event-network

  ticket-service:
    build:
      context: ./ticketservice
      dockerfile: Dockerfile
    container_name: ticket-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${TICKET_MONGODB_URI}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - EVENT_SERVICE_URL=http://event-service:4000
    networks:
      - event-network

  user-service:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=${USER_MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - OAUTH_SUCCESS_REDIRECT=${OAUTH_SUCCESS_REDIRECT}
    networks:
      - event-network

  payment-service:
    build:
      context: ./paymentservice
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "6000:6000"
    environment:
      - PORT=6000
      - NODE_ENV=production
      - MONGODB_URI=${PAYMENT_MONGODB_URI}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - TICKET_SERVICE_URL=http://ticket-service:5000
    networks:
      - event-network

  api-gateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - USER_SERVICE_URL=http://user-service:3000
      - EVENT_SERVICE_URL=http://event-service:4000
      - TICKET_SERVICE_URL=http://ticket-service:5000
      - PAYMENT_SERVICE_URL=http://payment-service:6000
    depends_on:
      - event-service
      - ticket-service
      - user-service
      - payment-service
    networks:
      - event-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - event-network

networks:
  event-network:
    driver: bridge
