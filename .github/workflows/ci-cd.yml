name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: event-management-rg
  CONTAINER_APP_ENV: event-management-env
  REGISTRY_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}

jobs:
  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-tests:
    name: Run Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Run Security & Business Logic Unit Tests
        run: node --test security-tests/*.test.js

  build-and-push:
    name: Build & Push to DockerHub
    needs: [sonarcloud-analysis, security-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [eventservice, ticketservice, userservice, paymentservice, apigateway, frontend]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY_NAME }}/${{ matrix.service }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY_NAME }}/${{ matrix.service }}:latest, ${{ env.REGISTRY_NAME }}/${{ matrix.service }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service == 'frontend' && format('VITE_API_URL={0}', secrets.API_GATEWAY_URL) || '' }}

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get Environment Default Domain
        id: env-domain
        uses: azure/CLI@v1
        with:
          inlineScript: |
            DOMAIN=$(az containerapp env show \
              --name ${{ env.CONTAINER_APP_ENV }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.defaultDomain -o tsv)
            echo "domain=$DOMAIN" >> $GITHUB_OUTPUT

      - name: Deploy User Service
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name user-service \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_NAME }}/userservice:${{ github.sha }} \
              --set-env-vars \
                MONGODB_URI=${{ secrets.MONGODB_URI_BASE }}/userdb \
                JWT_SECRET=${{ secrets.JWT_SECRET }}

      - name: Deploy Event Service
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name event-service \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_NAME }}/eventservice:${{ github.sha }} \
              --set-env-vars \
                MONGODB_URI=${{ secrets.MONGODB_URI_BASE }}/eventdb

      - name: Deploy Ticket Service
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name ticket-service \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_NAME }}/ticketservice:${{ github.sha }} \
              --set-env-vars \
                MONGODB_URI=${{ secrets.MONGODB_URI_BASE }}/ticketdb \
                EVENT_SERVICE_URL=https://event-service.internal.${{ steps.env-domain.outputs.domain }}

      - name: Deploy Payment Service
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name payment-service \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_NAME }}/paymentservice:${{ github.sha }} \
              --set-env-vars \
                MONGODB_URI=${{ secrets.MONGODB_URI_BASE }}/paymentdb \
                TICKET_SERVICE_URL=https://ticket-service.internal.${{ steps.env-domain.outputs.domain }}

      - name: Deploy API Gateway
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name api-gateway \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_NAME }}/apigateway:${{ github.sha }} \
              --set-env-vars \
                JWT_SECRET=${{ secrets.JWT_SECRET }} \
                USER_SERVICE_URL=https://user-service.internal.${{ steps.env-domain.outputs.domain }} \
                EVENT_SERVICE_URL=https://event-service.internal.${{ steps.env-domain.outputs.domain }} \
                TICKET_SERVICE_URL=https://ticket-service.internal.${{ steps.env-domain.outputs.domain }} \
                PAYMENT_SERVICE_URL=https://payment-service.internal.${{ steps.env-domain.outputs.domain }}

      - name: Deploy Frontend
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name event-frontend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_NAME }}/frontend:${{ github.sha }}
